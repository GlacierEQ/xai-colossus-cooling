name: CI — Colossus Cooling

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run unit tests
        run: |
          pytest tests/ \
            --tb=short \
            --asyncio-mode=auto \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v

      - name: Run gauntlet integration scenarios
        run: |
          python gauntlet_integration/run_gauntlet.py --ci --fail-on-critical
        continue-on-error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
            name: coverage-report
            path: htmlcov/
            retention-days: 7

      - name: Upload Aspen audit log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aspen-audit-log
          path: audit_logs/
          retention-days: 30

  simulation:
    name: Simulation Smoke Test
    runs-on: ubuntu-latest
    needs: test

    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run simulation smoke test
        run: |
          python simulation/run_simulation.py --smoke-test || echo 'Smoke test skipped — runner not present'

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ruff lint
        run: |
          pip install ruff
          ruff check . --select E,F,W --ignore E501 || true
