name: Cooling Core Truth Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core-behavior:
    name: Core simulation and truth surface
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio

      - name: Run fail-closed core gate
        run: |
          python -m pytest \
            tests/test_portfolio_truth_surface.py \
            tests/test_thermal_core.py \
            -q

  blueprint-smoke:
    name: Cross-platform blueprint smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install blueprint dependencies
        run: python -m pip install --disable-pip-version-check ezdxf matplotlib

      - name: Exercise stable root CLI
        run: |
          python apex_cli.py status
          python apex_cli.py blueprint --all --output /tmp/CCL-002-test

      - name: Verify generated artifacts
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = [
              Path("/tmp/CCL-002-test.dxf"),
              Path("/tmp/CCL-002-test.pdf"),
              Path("/tmp/CCL-002-test.svg"),
              Path("/tmp/CCL-002-test.png"),
          ]
          missing = [str(path) for path in expected if not path.exists() or path.stat().st_size == 0]
          if missing:
              raise SystemExit(f"Missing or empty blueprint outputs: {missing}")
          for path in expected:
              print(f"verified {path} ({path.stat().st_size} bytes)")
          PY

      - name: Upload blueprint artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cooling-blueprint-smoke
          path: |
            /tmp/CCL-002-test.dxf
            /tmp/CCL-002-test.pdf
            /tmp/CCL-002-test.svg
            /tmp/CCL-002-test.png
          retention-days: 14
