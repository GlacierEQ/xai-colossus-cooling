name: Dashboard M2A Tests

on:
  push:
    paths:
      - 'dashboard/**'
      - 'config/m2a/**'
      - 'schemas/m2a/**'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'config/m2a/**'
      - 'schemas/m2a/**'

jobs:
  test-dashboard-m2a:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Vitest
        run: npm run test:run
